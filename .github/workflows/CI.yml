name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        # Only of this repository: with `user`, Makie and GLMakie would compile again in each process
        include:
          - version: '1'
            coverage: --code-coverage=@${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # GLMakie needs OpenGL and a display, which only exists inside xvfb-run below
      - name: Install OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils
      # Precompilation is skipped here: GLMakie needs a display to initialize
      - name: Instantiate the test environment
        shell: julia --project=test --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
      # Tests do not need the first actions to be fast, and with coverage they drop that code anyway.
      # Not a file of the repository: `benchmark/` runs in the same environment and measures them.
      # The docs still build with the workloads, and test/TestPrecompileSession.jl runs the sessions
      - name: Switch off the precompile workloads
        run: printf '[BeamletOpticsGUI]\nprecompile_workload = false\n' > test/LocalPreferences.toml
      # A step of its own, such that the log shows its time and the workers do not wait for it
      - name: Precompile with xvfb
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            julia --project=test --color=yes -e "using BeamletOptics, BeamletOpticsGUI, GLMakie"
      # The test environment on the load path, such that the preference also holds in the environment
      # in which Aqua precompiles the package (persistent tasks), which otherwise runs the workload
      - name: Run tests with xvfb
        env:
          JULIA_LOAD_PATH: "@:${{ github.workspace }}/test:@stdlib"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            julia --project=test --color=yes ${{ matrix.coverage }} test/runtests.jl --jobs=4
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
