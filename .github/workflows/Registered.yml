name: Registered BeamletOptics
# Release check: the tests against the registered BeamletOptics instead of its master, as the
# users of a registered version get it. A version is registered only while this is green.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests with the registered BeamletOptics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # GLMakie needs OpenGL and a display, which only exists inside xvfb-run below
      - name: Install OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils
      - name: Use the registered BeamletOptics
        run: sed -i '/^BeamletOptics = {url = /d' Project.toml test/Project.toml docs/Project.toml
      # Fails if the compat entry of BeamletOptics admits no registered version
      - name: Instantiate the test environment
        shell: julia --project=test --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.status("BeamletOptics")
      - name: Run tests with xvfb
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            julia --project=test --color=yes test/runtests.jl
